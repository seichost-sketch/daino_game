<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unstable SMP Runner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hud">
        <p class="brand">UNSTABLE SMP</p>
        <p class="hint">Jump · tap again in air to backflip · Duck ParrotX2</p>
        <p class="scores">
          <span class="coins">● <span id="coins">00000</span></span>
          HI <span id="hi-score">00000</span>
          <span id="score">00000</span>
        </p>
      </header>
      <canvas id="game" width="1100" height="460" tabindex="0" aria-label="Wemmbu Unstable SMP runner"></canvas>
      <p id="status" class="status">Press Space to start</p>
      <section class="shop">
        <button id="buy-jetpack" type="button">Buy Jetpack · 100 ●</button>
        <p id="jet-owned" class="owned">Owned: 0 · 1 run each</p>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
